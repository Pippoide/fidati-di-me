# A ogni push sul branch "build": compila Fidati.app su un Mac di GitHub
# e pubblica una nuova release (dmg per installare, zip per l'updater interno).
# Sul branch "Build_BK" compila la seconda variante, "Fidati BK": app separata,
# release marcata pre-release (così /releases/latest resta quella di Fidati).
name: Build Fidati

on:
  push:
    branches: [build, Build_BK]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      BK: ${{ github.ref_name == 'Build_BK' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Test della logica di analisi ed eliminazione
        run: npm test

      - name: Imposta la versione ${{ env.VERSION }}
        run: npm version "$VERSION" --no-git-tag-version

      # Fidati BK: nome, identificativo e canale di aggiornamento propri,
      # così si installa accanto a Fidati senza sostituirla
      - name: Variante Fidati BK
        if: env.BK == 'true'
        run: |
          npm pkg set productName="Fidati BK" fidatiChannel=bk \
            build.productName="Fidati BK" build.appId=com.pippoide.fidati.bk \
            'build.artifactName=Fidati-BK-${version}-${arch}.${ext}'
          cat package.json | head -5

      - name: Compila Fidati.app (Apple Silicon + Intel)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BK" = "true" ]; then
            gh release create "v$VERSION-bk" release/*.dmg release/*.zip \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Fidati BK $VERSION" \
              --notes "**Fidati BK**: seconda variante dell'app, dal branch Build_BK, con il **Trasferimento ordinato**. Si installa accanto a Fidati (è un'app separata) e si aggiorna da sola con le release BK. Scarica il .dmg: **arm64** per Mac con chip Apple, **x64** per Mac Intel."
          else
            gh release create "v$VERSION" release/*.dmg release/*.zip \
              --target "$GITHUB_SHA" \
              --title "Fidati $VERSION" \
              --notes "Scarica il file .dmg: **arm64** per Mac con chip Apple (M1 e successivi), **x64** per Mac Intel. Chi ha già Fidati installata riceve l'aggiornamento dall'app."
          fi
